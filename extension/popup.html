<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Doublage</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-primary: #0f1117;
      --text-primary: #e8eaed;
      --text-secondary: #8a91a8;
      --text-muted: #525869;
      --card-bg: #1a1d27;
      --card-border: #252836;
      --card-shadow: none;
      --status-bg: #1a1d27;
      --status-border: #252836;
      --status-label: #8a91a8;
      --dot-ready: #3a3f52;
      --divider: #1e2130;
      --button-bg: rgba(255, 255, 255, 0.03);
      --button-border: rgba(255, 255, 255, 0.06);
      --button-color: #525869;
      --button-hover-bg: rgba(66, 133, 244, 0.09);
      --button-hover-border: rgba(66, 133, 244, 0.22);
      --button-hover-color: #8a96b4;
      --button-active-bg: linear-gradient(135deg, rgba(66, 133, 244, 0.2), rgba(26, 106, 219, 0.16));
      --button-active-border: rgba(66, 133, 244, 0.42);
      --button-active-color: #6ea8fe;
      --fav-pill-bg: rgba(255, 255, 255, 0.04);
      --fav-pill-border: rgba(255, 255, 255, 0.07);
      --fav-pill-color: #6b7385;
      --fav-pill-hover-bg: rgba(66, 133, 244, 0.1);
      --fav-pill-hover-border: rgba(66, 133, 244, 0.28);
      --fav-pill-hover-color: #a8b4cc;
      --fav-pill-active-bg: linear-gradient(135deg, rgba(66, 133, 244, 0.22), rgba(26, 106, 219, 0.18));
      --fav-pill-active-border: rgba(66, 133, 244, 0.45);
      --fav-pill-active-color: #6ea8fe;
      --fav-header-color: #42475a;
      --fav-empty-color: #353945;
      --slider-track: #252836;
      --slider-val-color: #6ea8fe;
      --footer-bg: #1a1d27;
      --footer-border: #303647;
      --footer-color: #a8b4cc;
      --footer-hover-bg: rgba(66, 133, 244, 0.12);
      --footer-hover-border: rgba(66, 133, 244, 0.45);
      --footer-hover-color: #6ea8fe;
    }

    [data-theme="light"] {
      --bg-primary: #f8f9fa;
      --text-primary: #1f2328;
      --text-secondary: #57606a;
      --text-muted: #6e7781;
      --card-bg: #ffffff;
      --card-border: #e1e4e8;
      --card-shadow: 0 1px 3px rgba(0, 0, 0, 0.06);
      --status-bg: #ffffff;
      --status-border: #e1e4e8;
      --status-label: #57606a;
      --dot-ready: #afb8c1;
      --divider: #eaecef;
      --button-bg: #f6f8fa;
      --button-border: #d0d7de;
      --button-color: #57606a;
      --button-hover-bg: #eef2ff;
      --button-hover-border: #adc6ff;
      --button-hover-color: #1a56db;
      --button-active-bg: #e8f0fe;
      --button-active-border: #4285f4;
      --button-active-color: #1a56db;
      --fav-pill-bg: #f6f8fa;
      --fav-pill-border: #d0d7de;
      --fav-pill-color: #57606a;
      --fav-pill-hover-bg: #eef2ff;
      --fav-pill-hover-border: #adc6ff;
      --fav-pill-hover-color: #1a56db;
      --fav-pill-active-bg: #e8f0fe;
      --fav-pill-active-border: #4285f4;
      --fav-pill-active-color: #1a56db;
      --fav-header-color: #8c959f;
      --fav-empty-color: #8c959f;
      --slider-track: #e1e4e8;
      --slider-val-color: #1a56db;
      --footer-bg: #ffffff;
      --footer-border: #d0d7de;
      --footer-color: #57606a;
      --footer-hover-bg: #e8f0fe;
      --footer-hover-border: #4285f4;
      --footer-hover-color: #1a56db;
    }

    body {
      width: 300px;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 18px 16px 14px;
      user-select: none;
      transition: background-color 0.2s, color 0.2s;
    }

    /* ── Header ──────────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .logo {
      font-size: 20px;
      font-weight: 700;
      color: #4285f4;
      letter-spacing: -0.5px;
    }
    .logo-tag {
      font-size: 10px;
      font-weight: 600;
      background: linear-gradient(135deg, #4285f4, #a142f4);
      color: #fff;
      padding: 2px 7px;
      border-radius: 20px;
    }

    /* ── Status bar ──────────────────────────────────────────────── */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 12px;
      background: var(--status-bg);
      border: 1px solid var(--status-border);
      border-radius: 10px;
      box-shadow: var(--card-shadow);
      margin-bottom: 10px;
      transition: background-color 0.2s, border-color 0.2s;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--dot-ready);
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .dot.active {
      background: #34a853;
      box-shadow: 0 0 7px #34a85366;
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }
    .status-label {
      font-size: 13px;
      color: var(--status-label);
      flex: 1;
    }
    .lang-pill {
      font-size: 11px;
      font-weight: 700;
      color: #4285f4;
      background: rgba(66, 133, 244, 0.12);
      border: 1px solid rgba(66, 133, 244, 0.25);
      padding: 2px 9px;
      border-radius: 20px;
      letter-spacing: 0.5px;
    }

    /* ── Error banner ────────────────────────────────────────────── */
    .error-banner {
      background: rgba(198, 40, 40, 0.12);
      border: 1px solid rgba(198, 40, 40, 0.35);
      color: #d93025;
      font-size: 12px;
      padding: 8px 10px 8px 11px;
      border-radius: 8px;
      margin-bottom: 10px;
      display: none;
      align-items: flex-start;
      gap: 8px;
      line-height: 1.4;
    }
    [data-theme="dark"] .error-banner {
      background: rgba(198, 40, 40, 0.15);
      border-color: rgba(198, 40, 40, 0.4);
      color: #ef9a9a;
    }
    .error-banner.visible { display: flex; }
    .error-text { flex: 1; }
    .error-dismiss {
      background: none;
      border: none;
      color: inherit;
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
      padding: 0;
      flex-shrink: 0;
      opacity: 0.6;
      transition: opacity 0.15s;
    }
    .error-dismiss:hover { opacity: 1; }

    /* ── Favorites quick-pick ────────────────────────────────────── */
    .fav-section { margin-bottom: 10px; }
    .fav-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 7px;
    }
    .fav-header {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--fav-header-color);
      font-weight: 600;
    }
    .add-lang-btn {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1px solid rgba(66, 133, 244, 0.45);
      background: rgba(66, 133, 244, 0.15);
      color: #4285f4;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      line-height: 1;
      transition: all 0.18s;
      flex-shrink: 0;
    }
    .add-lang-btn:hover {
      background: rgba(66, 133, 244, 0.28);
      border-color: rgba(66, 133, 244, 0.7);
      color: #6ea8fe;
    }
    .fav-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .fav-pill {
      padding: 5px 12px;
      border-radius: 8px;
      border: 1px solid var(--fav-pill-border);
      background: var(--fav-pill-bg);
      color: var(--fav-pill-color);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s;
      white-space: nowrap;
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: 0.1px;
    }
    .fav-pill:hover {
      background: var(--fav-pill-hover-bg);
      border-color: var(--fav-pill-hover-border);
      color: var(--fav-pill-hover-color);
    }
    .fav-pill.active {
      background: var(--fav-pill-active-bg);
      border-color: var(--fav-pill-active-border);
      color: var(--fav-pill-active-color);
      font-weight: 600;
      box-shadow: 0 0 0 1px rgba(66, 133, 244, 0.15);
    }
    .fav-empty {
      font-size: 11px;
      color: var(--fav-empty-color);
      font-style: italic;
    }

    /* ── Mode controls card ──────────────────────────────────────── */
    .ctrl-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      box-shadow: var(--card-shadow);
      padding: 11px 12px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 11px;
      transition: background-color 0.2s, border-color 0.2s;
    }
    .ctrl-volume-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .ctrl-volume-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .ctrl-label-inline {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }
    .ctrl-label-inline .vol-icon {
      font-size: 13px;
      line-height: 1;
    }
    .ctrl-volume-val {
      font-size: 11px;
      font-weight: 700;
      color: var(--slider-val-color);
      min-width: 32px;
      text-align: right;
    }
    .volume-slider {
      width: 100%;
      height: 5px;
      border-radius: 3px;
      background: var(--slider-track);
      accent-color: #4285f4;
      cursor: pointer;
      outline: none;
      transition: background-color 0.2s;
    }
    .ctrl-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-top: 10px;
      border-top: 1px solid var(--divider);
    }
    .ctrl-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      font-weight: 600;
      width: 48px;
      flex-shrink: 0;
    }
    .ctrl-btns {
      display: flex;
      gap: 4px;
      flex: 1;
    }
    .ctrl-btn {
      flex: 1;
      padding: 5px 4px;
      border-radius: 7px;
      border: 1px solid var(--button-border);
      background: var(--button-bg);
      color: var(--button-color);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s;
      white-space: nowrap;
      text-align: center;
      line-height: 1.3;
    }
    .ctrl-btn:hover {
      background: var(--button-hover-bg);
      border-color: var(--button-hover-border);
      color: var(--button-hover-color);
    }
    .ctrl-btn.active {
      background: var(--button-active-bg);
      border-color: var(--button-active-border);
      color: var(--button-active-color);
      font-weight: 600;
      box-shadow: 0 0 0 1px rgba(66, 133, 244, 0.12);
    }
    .ctrl-btn .btn-icon { font-size: 13px; display: block; margin-bottom: 1px; }
    .ctrl-btn .btn-lbl  { font-size: 10px; display: block; letter-spacing: 0.2px; }

    /* ── Main button ─────────────────────────────────────────────── */
    .btn-main {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: filter 0.15s, transform 0.1s;
      margin-bottom: 10px;
    }
    .btn-main:active { transform: scale(0.97); }
    .btn-main:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-main.start {
      background: linear-gradient(135deg, #4285f4, #1a6adb);
      color: #fff;
      box-shadow: 0 2px 6px rgba(66, 133, 244, 0.35);
    }
    .btn-main.start:not(:disabled):hover { filter: brightness(1.1); }
    .btn-main.stop {
      background: linear-gradient(135deg, #e53935, #b71c1c);
      color: #fff;
      box-shadow: 0 2px 6px rgba(229, 57, 53, 0.35);
    }
    .btn-main.stop:not(:disabled):hover { filter: brightness(1.1); }

    /* ── Footer ──────────────────────────────────────────────────── */
    .footer {
      display: flex;
      justify-content: center;
    }
    .link-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--footer-bg);
      border: 1px solid var(--footer-border);
      border-radius: 8px;
      box-shadow: var(--card-shadow);
      color: var(--footer-color);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      padding: 9px 12px;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .link-btn:hover {
      background: var(--footer-hover-bg);
      border-color: var(--footer-hover-border);
      color: var(--footer-hover-color);
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">Doublage</span>
    <span class="logo-tag">Gemini Live</span>
  </div>

  <div class="status-bar">
    <div class="dot" id="statusDot"></div>
    <span class="status-label" id="statusLabel">Ready</span>
    <span class="lang-pill" id="langPill">–</span>
  </div>

  <div class="error-banner" id="errorBanner">
    <span class="error-text" id="errorText"></span>
    <button class="error-dismiss" id="errorDismiss" title="Dismiss">&#x2715;</button>
  </div>

  <!-- Favorite languages quick-pick -->
  <div class="fav-section" id="favSection">
    <div class="fav-header-row">
      <div class="fav-header">Choose translation language</div>
      <button class="add-lang-btn" id="addLangBtn" title="Add languages in Settings">+</button>
    </div>
    <div class="fav-pills" id="favPills"></div>
  </div>

  <!-- Mode controls -->
  <div class="ctrl-card">
    <div class="ctrl-volume-section">
      <div class="ctrl-volume-header">
        <label for="duckVolume" class="ctrl-label-inline">
          <span class="vol-icon" id="volIcon">🔉</span> Original Audio Volume
        </label>
        <output class="ctrl-volume-val" id="duckVolumeVal">20%</output>
      </div>
      <input type="range" class="volume-slider" id="duckVolume" min="0" max="100" value="20" step="1" title="Original audio volume" />
    </div>
    <div class="ctrl-row">
      <span class="ctrl-label">Output</span>
      <div class="ctrl-btns" id="outputCtrl">
        <button class="ctrl-btn" id="ctrlAudio" title="Spoken audio translation">
          <span class="btn-icon">🎙</span>
          <span class="btn-lbl">Audio</span>
        </button>
        <button class="ctrl-btn" id="ctrlText" title="On-screen subtitles">
          <span class="btn-icon">💬</span>
          <span class="btn-lbl">Subtitles</span>
        </button>
        <button class="ctrl-btn" id="ctrlBoth" title="Spoken audio + subtitles">
          <span class="btn-icon">🎙+💬</span>
          <span class="btn-lbl">Both</span>
        </button>
      </div>
    </div>
  </div>

  <button class="btn-main start" id="mainBtn">
    <span id="btnIcon">▶</span>
    <span id="btnText">Start Translation</span>
  </button>

  <div class="footer">
    <button class="link-btn" id="settingsBtn" title="Open extension settings">⚙ <span>Settings</span></button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
