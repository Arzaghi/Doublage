name: Publish Chrome Extension

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create extension ZIP
        run: |
          cd extension
          zip -r ../extension.zip .

      - name: Get Google access token
        id: auth
        run: |
          RESPONSE=$(curl -s \
            -X POST \
            https://oauth2.googleapis.com/token \
            -d client_id="${{ secrets.GOOGLE_CLIENT_ID }}" \
            -d client_secret="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
            -d refresh_token="${{ secrets.GOOGLE_REFRESH_TOKEN }}" \
            -d grant_type=refresh_token)

          ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')

          echo "ACCESS_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Upload extension
        run: |
          curl \
            -X POST \
            -H "Authorization: Bearer ${{ steps.auth.outputs.ACCESS_TOKEN }}" \
            -T extension.zip \
            "https://chromewebstore.googleapis.com/upload/v2/publishers/${{ secrets.CHROME_PUBLISHER_ID }}/items/${{ secrets.CHROME_EXTENSION_ID }}:upload"

      - name: Publish extension
        run: |
          curl \
            -X POST \
            -H "Authorization: Bearer ${{ steps.auth.outputs.ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "https://chromewebstore.googleapis.com/v2/publishers/${{ secrets.CHROME_PUBLISHER_ID }}/items/${{ secrets.CHROME_EXTENSION_ID }}:publish"